# Valida cada workflow y cada formulario de este repositorio contra las
# especificaciones que publica EventConductor, con el workflow-maven-plugin.
#
# Es el único check de este repositorio: aquí no hay código que compilar, sólo
# definiciones que tienen que ser correctas antes de llegar a master.

name: Validate definitions

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# Un push nuevo a la misma rama invalida la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflows & forms
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Validate definitions
        run: |
          set -o pipefail
          mvn -B -ntp verify | tee mvn.log

      # El modo en que esto falla es en verde: un validador que no encuentra los
      # ficheros no se queja, informa de cero y da el build por bueno. Ya pasó una
      # vez, con las extensiones .ec. Así que se compara lo que hay con lo que el
      # plugin dice haber validado, y no cuadrar es un fallo.
      - name: Se validaron todas las definiciones
        run: |
          declared=$(find definitions -type f ! -name '*.md' | wc -l)
          validated=$(sed -n 's/.*EventConductor: \([0-9]\+\) definition(s) validated.*/\1/p' mvn.log | tail -1)
          validated=${validated:-0}
          echo "definiciones: $declared — validadas: $validated"
          if [ "$validated" -ne "$declared" ]; then
            echo "::error::$declared definiciones en definitions/, pero el plugin validó $validated."
            echo "Causas probables: una extensión que el plugin no reconoce, o un tipo"
            echo "de definición desactivado en el pom (validateRules está a false)."
            find definitions -type f ! -name '*.md' | sort
            exit 1
          fi
